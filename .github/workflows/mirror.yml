name: mirror

# Pull-based push mirror: periodically syncs refs from the upstream
# Forgejo repo (https://git.b4mad.industries/agentic-forges/forgejo-mcp)
# into this GitHub repo so flake inputs can fetch from GitHub's CDN.
#
# Sync semantics:
#   - Default branch: upstream's default branch is MERGED in (not
#     force-pushed) so this repo's mirror.yml commit survives every sync
#     while upstream commits land in its history.
#   - All other branches, tags, and notes: explicit force push. We do NOT
#     use `git push --mirror` from a checkout: GitHub rejects pushes to
#     refs/pull/*, and a partially-successful mirror push prunes every
#     remote branch missing locally (observed on run 34752308170).
#   - Branches deleted upstream are intentionally NOT pruned here.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://git.b4mad.industries/agentic-forges/forgejo-mcp.git || \
            git remote set-url upstream https://git.b4mad.industries/agentic-forges/forgejo-mcp.git
          git config user.name "mirror-bot"
          git config user.email "25236236+johnconnuck@users.noreply.github.com"
          for attempt in 1 2 3; do
            if git fetch --force upstream \
                'refs/heads/*:refs/remotes/upstream/heads/*' \
                'refs/tags/*:refs/tags/*' \
                'refs/notes/*:refs/notes/*'; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 10
          done

      - name: Sync default branch
        run: |
          default=$(git rev-parse --abbrev-ref HEAD)
          git merge --no-edit "refs/remotes/upstream/heads/$default"
          git push origin "HEAD:refs/heads/$default"

      - name: Push branches, tags, and notes
        run: |
          default=$(git rev-parse --abbrev-ref HEAD)
          args=()
          while read -r ref; do
            b=${ref#refs/remotes/upstream/heads/}
            [ "$b" = "$default" ] && continue
            args+=("$ref:refs/heads/$b")
          done < <(git for-each-ref --format '%(refname)' refs/remotes/upstream/heads)
          args+=('refs/tags/*:refs/tags/*' 'refs/notes/*:refs/notes/*')
          git push --force origin "${args[@]}"
