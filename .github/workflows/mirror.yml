name: mirror

# Pull-based push mirror: periodically syncs refs from the upstream
# Forgejo repo (https://git.b4mad.industries/agentic-forges/forgejo-mcp)
# into this GitHub repo so flake inputs can fetch from GitHub's CDN.
#
# Sync semantics:
#   - Default branch: upstream's default branch is MERGED in (not
#     force-pushed) so this repo's mirror.yml commit survives every sync
#     while upstream commits land in its history.
#   - All other branches, tags, and notes: explicit force push. We do NOT
#     use `git push --mirror` from a checkout: GitHub rejects pushes to
#     refs/pull/*, and a partially-successful mirror push prunes every
#     remote branch missing locally (observed on run 34752308170).
#   - Branches deleted upstream are intentionally NOT pruned here.
#   - Release binaries: upstream release assets (tarballs + checksums,
#     no .mcpb/.sbom/.sig sidecars) are downloaded from the Forgejo API
#     and uploaded to matching GitHub releases. Idempotent.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://git.b4mad.industries/agentic-forges/forgejo-mcp.git || \
            git remote set-url upstream https://git.b4mad.industries/agentic-forges/forgejo-mcp.git
          git config user.name "mirror-bot"
          git config user.email "25236236+johnconnuck@users.noreply.github.com"
          for attempt in 1 2 3; do
            if git fetch --force upstream \
                'refs/heads/*:refs/remotes/upstream/heads/*' \
                'refs/tags/*:refs/tags/*' \
                'refs/notes/*:refs/notes/*'; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 10
          done

      - name: Sync default branch
        run: |
          default=$(git rev-parse --abbrev-ref HEAD)
          git merge --no-edit "refs/remotes/upstream/heads/$default"
          git push origin "HEAD:refs/heads/$default"

      - name: Push branches, tags, and notes
        run: |
          default=$(git rev-parse --abbrev-ref HEAD)
          args=()
          while read -r ref; do
            b=${ref#refs/remotes/upstream/heads/}
            [ "$b" = "$default" ] && continue
            args+=("$ref:refs/heads/$b")
          done < <(git for-each-ref --format '%(refname)' refs/remotes/upstream/heads)
          args+=('refs/tags/*:refs/tags/*' 'refs/notes/*:refs/notes/*')
          git push --force origin "${args[@]}"

      - name: Sync release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://git.b4mad.industries/api/v1/repos/agentic-forges/forgejo-mcp"
          # tarballs + checksums only; skip .mcpb, .sbom, .sig sidecars
          WANT='^forgejo-mcp_[0-9][0-9.]*_(linux|darwin)_(amd64|arm64)\.tar\.gz$|^forgejo-mcp_[0-9][0-9.]*_checksums\.txt$'

          retry3() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              [ "$n" -ge 3 ] && return 1
              sleep 10
            done
          }

          # page through the Forgejo releases API (100/page); keep only
          # wanted assets, deduped by name (older releases carry duplicate
          # asset rows re-uploaded under the same name)
          : > /tmp/releases.jsonl
          for page in 1 2 3 4 5; do
            raw=$(retry3 curl -fsS "$API/releases?limit=100&page=$page")
            len=$(jq 'length' <<<"$raw")
            [ "$len" -eq 0 ] && break
            jq -c --arg w "$WANT" '.[] | {tag: .tag_name, assets: ([.assets[]
                 | select(.name | test($w))
                 | {name, url: .browser_download_url}]
                 | unique_by(.name))}
               | select(.assets | length > 0)' <<<"$raw" \
              >> /tmp/releases.jsonl
            [ "$len" -lt 100 ] && break
          done

          while read -r rel; do
            tag=$(jq -r '.tag' <<<"$rel")
            want=$(jq -r '.assets[].name' <<<"$rel" | LC_ALL=C sort)
            have=$(gh release view "$tag" --json assets \
                     -q '.assets[].name' 2>/dev/null | LC_ALL=C sort || true)
            missing=$(LC_ALL=C comm -23 <(printf '%s\n' "$want") <(printf '%s\n' "$have"))
            if [ -z "$missing" ]; then
              echo "release $tag: assets up to date"
              continue
            fi
            echo "release $tag: syncing $(printf '%s\n' "$missing" | grep -c .) asset(s)"
            # no --target: the API resolves the commit from the tag itself
            gh release view "$tag" >/dev/null 2>&1 || \
              gh release create "$tag" --title "$tag" \
                --notes "Mirror of upstream release $tag, synced from https://git.b4mad.industries/agentic-forges/forgejo-mcp"
            tmp=$(mktemp -d)
            files=()
            while read -r name; do
              [ -z "$name" ] && continue
              url=$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .url' <<<"$rel")
              retry3 curl -fsSL "$url" -o "$tmp/$name"
              files+=("$tmp/$name")
            done <<<"$missing"
            gh release upload "$tag" "${files[@]}" --clobber
            rm -rf "$tmp"
          done < /tmp/releases.jsonl
